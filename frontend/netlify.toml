[build]
  command = "npm run build"
  publish = "dist"

# Proxy every API/file call to the real backend (Express server hosted
# elsewhere — Netlify cannot run it). Replace the placeholder with the
# backend's real public URL once it is deployed.
[[redirects]]
  from = "/api/*"
  to = "https://SEU-BACKEND-AQUI.exemplo.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/results/*"
  to = "https://SEU-BACKEND-AQUI.exemplo.com/results/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://SEU-BACKEND-AQUI.exemplo.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback: any other route (e.g. /render, /planta-humanizada) is served
# index.html so React Router can take over client-side, instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
